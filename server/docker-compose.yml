# Example for self-hosting. Put a reverse proxy with TLS (e.g. Caddy) in front.
services:
  jsp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      # Required: at least 32 characters, e.g. `openssl rand -hex 32`.
      # Alternatively mount a secret and set JSP_UPLOAD_TOKEN_FILE.
      JSP_UPLOAD_TOKEN: ${JSP_UPLOAD_TOKEN:?set JSP_UPLOAD_TOKEN}
    # The image runs as UID/GID 33; ./data and ./quotes must be accessible to it
    # (e.g. `sudo chown -R 33:33 data quotes`), or set `user:` to their owner.
    volumes:
      - ./data:/var/www/data
      - ./quotes:/var/www/quotes:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
